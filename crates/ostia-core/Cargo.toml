[package]
name = "ostia-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { workspace = true }
serde_yaml = { workspace = true }
glob = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
aes-gcm = "0.10"
base64 = "0.22"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
async-trait = "0.1"
secrecy = { version = "0.10", features = ["serde"] }
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
tempfile = "3"
