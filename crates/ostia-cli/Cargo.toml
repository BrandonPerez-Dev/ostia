[package]
name = "ostia-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ostia"
path = "src/main.rs"

[dependencies]
ostia-core = { path = "../ostia-core" }
ostia-sandbox = { path = "../ostia-sandbox" }
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "net"] }
axum = "0.8"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
aes-gcm = "0.10"
base64 = "0.22"
nix = { workspace = true }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
